<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>
</head>
<body>
    <div style="display: flex;justify-content: space-evenly;padding: 70px;">
        <div id="notes">
            Loading...
        </div>
        <div>
            <input id="userNote" type="text">
            <button onclick="addTodos()">Create new note</button>
        </div>
    </div>
    <script>
      async  function getTodos(){
            //fetch

            // const response=await fetch('http://localhost:5000/notes')
            // const json=await response.json()
            // console.log(json.notes)
            
            
            //axios

            const res=await axios.get('http://localhost:5000/notes')
            const notes=res.data.notes
            console.log(res.data.notes)
        
            document.getElementById("notes").innerHTML=""
            for(let i=0;i<notes.length;i++){
                const noteNote=document.createElement("div")
                noteNote.innerHTML=notes[i]
                document.getElementById("notes").appendChild(noteNote)
            }
        }
                getTodos()

        async function addTodos() {
            if(document.getElementById("userNote").value==="")return;
           await axios.post("http://localhost:5000/create",{
                note:document.getElementById("userNote").value
            })

            const newNode=document.createElement("div")
              newNode.innerHTML=document.getElementById("userNote").value
              newNode.setAttribute("style","border:2px solid red")
                document.getElementById("notes").appendChild(newNode)


            document.getElementById("userNote").value=""
        }
    </script>
</body>
</html>
